<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Board</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

        :root {
            --ink: #28221f;
            --muted: #81756e;
            --paper: #f8f3ed;
            --panel: #fffdfa;
            --line: #e7ddd3;
            --accent: #a35d42;
            --accent-soft: #f1ddd1;
            --sage: #dfe4d5;
            --gold: #d9a649;
            --shadow: 0 18px 50px rgba(76, 53, 39, 0.08);
        }

        [data-theme="night"] {
            --ink: #f8efe6;
            --muted: #b5a49a;
            --paper: #171312;
            --panel: #241d1a;
            --line: #433832;
            --accent: #d79773;
            --accent-soft: #4b3029;
            --sage: #394137;
            --gold: #e4bb66;
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
        }

        [data-theme="rose"] {
            --ink: #38252a;
            --muted: #94747a;
            --paper: #fff6f6;
            --panel: #fffdfc;
            --line: #eedde0;
            --accent: #ba6877;
            --accent-soft: #f6dce2;
            --sage: #e4e5d7;
            --gold: #c9913c;
            --shadow: 0 18px 50px rgba(122, 66, 76, 0.08);
        }

        [data-theme="sage"] {
            --ink: #08794c;
            --muted: #3c6350;
            --paper: #f3f5ee;
            --panel: #fcfdf9;
            --line: #dbe3d9;
            --accent: #657c6e;
            --accent-soft: #dae6dc;
            --sage: #d7e0d1;
            --gold: #c29142;
            --shadow: 0 18px 50px rgba(54, 78, 62, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--paper);
            font-family: 'DM Sans', sans-serif;
            transition: background 0.25s ease, color 0.25s ease;
        }

        button, input, textarea {
            font: inherit;
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .page {
            max-width: 1220px;
            margin: 0 auto;
            padding: 48px 32px 72px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 32px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        h1, h2, h3, p {
            margin: 0;
        }

        h1 {
            max-width: 640px;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.4rem, 4vw, 4.4rem);
            line-height: 1.05;
            letter-spacing: -1.2px;
        }

        h1 em {
            color: var(--accent);
            font-style: normal;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .add-photo-btn,
        .url-box button {
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .add-photo-btn {
            padding: 10px 18px;
            box-shadow: var(--shadow);
        }

        .add-photo-btn:hover,
        .url-box button:hover {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        .theme-picker {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            box-shadow: var(--shadow);
        }

        .theme-dot {
            width: 22px;
            height: 22px;
            border: 2px solid transparent;
            border-radius: 50%;
            outline: 1px solid var(--line);
            cursor: pointer;
            transition: transform 0.2s ease, outline-color 0.2s ease;
        }

        .theme-dot.selected {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            transform: scale(1.06);
        }

        .url-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 28px;
            padding: 12px 14px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }

        .url-box.hidden {
            display: none;
        }

        .url-box input {
            flex: 1;
            min-width: 0;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: transparent;
            color: var(--ink);
            outline: none;
        }

        .url-box input:focus {
            border-color: var(--accent);
        }

        .url-box button {
            padding: 11px 16px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .photo {
            position: relative;
            min-height: 220px;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid rgba(0,0,0,.04);
            background: #e7d8ca;
            box-shadow: var(--shadow);
            cursor: grab;
        }

        .photo.dragging {
            opacity: 0.55;
            cursor: grabbing;
        }

        .photo.tall {
            grid-row: span 2;
            min-height: 460px;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-remove {
            position: absolute;
            top: 10px;
            right: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 50%;
            background: rgba(20, 17, 16, 0.6);
            color: #fff;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            z-index: 2;
        }

        .board-shell {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 22px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }

        .board-card {
            padding: 24px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.5rem, 2vw, 2rem);
            letter-spacing: -0.5px;
        }

        .mini-link {
            border: 0;
            background: transparent;
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .mood-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .photo {
            position: relative;
            min-height: 230px;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,.04);
            background: #e7d8ca;
        }

        .photo.tall {
            grid-row: span 2;
            min-height: 468px;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .side-stack {
            display: grid;
            gap: 22px;
        }

        .panel,
        .quote-box {
            padding: 22px 20px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 10px;
            margin-bottom: 18px;
        }

        .mood-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--accent-soft);
            font-size: 28px;
        }

        .score {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1;
        }

        .muted {
            color: var(--muted);
            font-size: 12px;
        }

        .scale {
            display: flex;
            gap: 6px;
            margin-top: 18px;
        }

        .scale button {
            flex: 1;
            height: 8px;
            border: 0;
            border-radius: 999px;
            background: var(--line);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .scale button.active {
            background: var(--accent);
        }

        .quote-box {
            background: linear-gradient(180deg, var(--ink) 0%, var(--ink) 100%);
            color: var(--paper);
        }

        .quote-box .eyebrow {
            color: var(--gold);
        }

        blockquote {
            margin: 18px 0 12px;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.4rem, 2vw, 2.1rem);
            line-height: 1.3;
        }

        cite {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-style: normal;
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .board-shell {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .page {
                padding: 30px 18px 48px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .top-actions {
                width: 100%;
                justify-content: space-between;
            }

            .theme-picker {
                width: 100%;
                justify-content: center;
            }

            .url-box {
                flex-direction: column;
                align-items: stretch;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .mood-grid {
                grid-template-columns: 1fr;
            }

            .photo.tall {
                min-height: 260px;
                grid-row: auto;
            }
        }
    </style>
</head>
<body data-theme="classic">
    <div class="page">
        <header class="topbar">
            <div>
                <p class="eyebrow">Mood board</p>
                <h1>Manifesting a <em>perfect day.</em></h1>
            </div>

            <div class="top-actions">
                <button class="add-photo-btn" id="add-photo-btn" type="button">+ Add photo</button>
                <div class="theme-picker" aria-label="Theme selector">
                    <button class="theme-dot selected" data-set-theme="classic" style="background:#28221f" aria-label="Classic theme"></button>
                    <button class="theme-dot" data-set-theme="night" style="background:#171312" aria-label="Night theme"></button>
                    <button class="theme-dot" data-set-theme="rose" style="background:#ba6877" aria-label="Rose theme"></button>
                    <button class="theme-dot" data-set-theme="sage" style="background:#657c6e" aria-label="Sage theme"></button>
                </div>
            </div>
        </header>

        <div class="url-box hidden" id="url-box">
            <input id="photo-url" type="url" placeholder="Paste an image URL here" aria-label="Image URL">
            <button id="save-photo" type="button">Add to board</button>
        </div>

        <main class="gallery" id="gallery" aria-live="polite">
            <article class="photo tall">
                <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=80" alt="Warm and cozy desk setup">
            </article>

            <article class="photo">
                <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1200&q=80" alt="Cream room with plants">
            </article>

            <article class="photo">
                <img src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=700&q=80" alt="Coffee and notebook">
            </article>

            <article class="photo">
                <img src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=700&q=80" alt="Minimal home styling">
            </article>

            <article class="photo">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700&q=80" alt="Sunlit walk">
            </article>

            <article class="photo tall">
                <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=900&q=80" alt="Warm interior and flowers">
            </article>

            <article class="photo">
                <img src="https://i.pinimg.com/736x/e6/68/88/e668886f4094d72b06094e5dbe05d52c.jpg" alt="Person in a cozy setting">
            </article>

            <article class="photo">
                <img src="https://i.pinimg.com/1200x/bd/da/97/bdda97647e842a52553cb168ec3f7589.jpg" alt="A calm café moment">
            </article>
        </main>
    </div>

    <script>
        const body = document.body;
        const addPhotoBtn = document.getElementById('add-photo-btn');
        const urlBox = document.getElementById('url-box');
        const photoUrlInput = document.getElementById('photo-url');
        const savePhotoBtn = document.getElementById('save-photo');
        const gallery = document.getElementById('gallery');
        let draggedPhoto = null;

        function normalizeImageUrl(value) {
            const trimmed = value.trim();
            if (!trimmed) return '';

            try {
                const url = new URL(trimmed);
                const path = url.pathname.toLowerCase();
                const isDirectImage = /\.(png|jpe?g|gif|webp|avif|bmp|svg)(\?.*)?$/.test(path) || path.includes('/photo-');

                if (isDirectImage || path.includes('images.unsplash.com')) {
                    return trimmed;
                }

                const unsplashMatch = trimmed.match(/unsplash\.com\/(?:photos|s)\/([A-Za-z0-9_-]+)/i);
                if (unsplashMatch && unsplashMatch[1]) {
                    return `https://images.unsplash.com/photo-${unsplashMatch[1]}?auto=format&fit=crop&w=1200&q=80`;
                }
            } catch (error) {
                return trimmed;
            }

            return trimmed;
        }

        function attachPhotoInteractions(photo) {
            photo.draggable = true;

            photo.addEventListener('dragstart', (event) => {
                draggedPhoto = photo;
                photo.classList.add('dragging');
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', '');
            });

            photo.addEventListener('dragend', () => {
                draggedPhoto = null;
                photo.classList.remove('dragging');
                document.querySelectorAll('.photo').forEach((card) => card.classList.remove('drag-over'));
            });

            photo.addEventListener('dragover', (event) => {
                event.preventDefault();
                photo.classList.add('drag-over');
            });

            photo.addEventListener('dragleave', () => {
                photo.classList.remove('drag-over');
            });

            photo.addEventListener('drop', (event) => {
                event.preventDefault();
                photo.classList.remove('drag-over');

                if (!draggedPhoto || draggedPhoto === photo) return;

                const dropBefore = (event.clientY - photo.getBoundingClientRect().top) < photo.offsetHeight / 2;
                if (dropBefore) {
                    gallery.insertBefore(draggedPhoto, photo);
                } else {
                    gallery.insertBefore(draggedPhoto, photo.nextElementSibling);
                }
            });

            photo.querySelector('.photo-remove')?.addEventListener('click', () => {
                photo.remove();
            });
        }

        function createPhotoCard(url, label) {
            const article = document.createElement('article');
            article.className = 'photo';
            article.innerHTML = `
                <button class="photo-remove" type="button" aria-label="Remove image">×</button>
                <img src="${url}" alt="Custom mood board image">
            `;

            const image = article.querySelector('img');
            image.addEventListener('error', () => {
                image.src = 'https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=1200&q=80';
            });

            attachPhotoInteractions(article);
            return article;
        }

        document.querySelectorAll('.photo').forEach((photo) => {
            attachPhotoInteractions(photo);
        });

        addPhotoBtn.addEventListener('click', () => {
            urlBox.classList.toggle('hidden');
            if (!urlBox.classList.contains('hidden')) {
                photoUrlInput.focus();
            }
        });

        savePhotoBtn.addEventListener('click', () => {
            const rawUrl = photoUrlInput.value.trim();
            const url = normalizeImageUrl(rawUrl);
            if (!url) return;

            const label = 'custom mood';
            gallery.appendChild(createPhotoCard(url, label));
            photoUrlInput.value = '';
            urlBox.classList.add('hidden');
        });

        document.querySelectorAll('[data-set-theme]').forEach((button) => {
            button.addEventListener('click', () => {
                const selectedTheme = button.dataset.setTheme;
                body.dataset.theme = selectedTheme;
                document.querySelectorAll('.theme-dot').forEach((dot) => {
                    dot.classList.toggle('selected', dot === button);
                });
                localStorage.setItem('perfect-day-theme', selectedTheme);
            });
        });

        const savedTheme = localStorage.getItem('perfect-day-theme');
        if (savedTheme) {
            body.dataset.theme = savedTheme;
            document.querySelectorAll('.theme-dot').forEach((dot) => {
                dot.classList.toggle('selected', dot.dataset.setTheme === savedTheme);
            });
        }
    </script>
</body>
</html>
