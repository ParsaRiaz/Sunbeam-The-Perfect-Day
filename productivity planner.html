<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning &amp; Productivity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#cba1d4;
    --panel:#F4EEFF;
    --lavender:#4b3250;
    --periwinkle:#725d75;
    --indigo:#5d2b54;
    --peach:#a78a9f;
    --rose:#F62440;
    --ink:#2c2f4f;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--cream);
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
  }

  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }

  .tag{
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size:1.05rem;
    color:var(--indigo);
  }

  button{
    font-family:'DM Sans', sans-serif;
    cursor:pointer;
    border-radius:0;
  }

  input, select{
    font-family:'DM Sans', sans-serif;
    border-radius:0;
  }

  /* ---------- crop-mark corner signature ---------- */
  .panel{
    position:relative;
    background:var(--panel);
    border:1.5px solid var(--indigo);
  }
  .panel::before, .panel::after,
  .panel .cm-tr, .panel .cm-br{
    content:"+";
    position:absolute;
    font-family:'DM Sans', sans-serif;
    font-size:14px;
    line-height:1;
    color:var(--periwinkle);
    pointer-events:none;
  }
  .panel::before{ top:-8px; left:-6px; }
  .panel::after{ bottom:-8px; left:-6px; }
  .panel .cm-tr{ top:-8px; right:-6px; }
  .panel .cm-br{ bottom:-8px; right:-6px; }

  /* ---------- app shell ---------- */
  .app{
    display:grid;
    grid-template-columns: 0.85fr 1.35fr;
    gap:22px;
    height:100vh;
    padding:22px;
  }

  .col-right{
    display:grid;
    grid-template-rows: 1.5fr 1fr;
    gap:22px;
    min-height:0;
  }

  .panel{
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .panel-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1.5px solid var(--lavender);
  }

  .panel-head h2{
    font-size:1.35rem;
    color:var(--indigo);
  }

  /* ================= TO-DO ================= */
  .todo-add{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }

  .todo-add input{
    flex:1;
    padding:10px 12px;
    border:1.5px solid var(--lavender);
    background:var(--cream);
    font-size:0.95rem;
    color:var(--ink);
  }

  .todo-add input:focus{
    outline:none;
    border-color:var(--periwinkle);
  }

  .todo-add button{
    padding:0 16px;
    background:var(--indigo);
    color:var(--cream);
    border:1.5px solid var(--indigo);
    font-weight:600;
    font-size:0.9rem;
    letter-spacing:0.02em;
  }

  .todo-add button:hover{
    background:var(--ink);
  }

  .todo-list{
    overflow-y:auto;
    flex:1;
  }

  .todo-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid var(--lavender);
  }

  .todo-item input[type=checkbox]{
    width:17px;
    height:17px;
    accent-color:var(--indigo);
    flex:none;
    cursor:pointer;
  }

  .todo-item span{
    flex:1;
    font-size:0.95rem;
    word-break:break-word;
  }

  .todo-item.done span{
    text-decoration:line-through;
    color:var(--periwinkle);
  }

  .todo-item button{
    background:none;
    border:none;
    color:var(--periwinkle);
    font-size:1.1rem;
    line-height:1;
    padding:2px 4px;
  }

  .todo-item button:hover{
    color:var(--rose);
  }

  .todo-empty{
    color:var(--periwinkle);
    font-size:0.9rem;
    padding:14px 4px;
    font-style:italic;
  }

  /* ================= CALENDAR ================= */

  .cal-panel .panel-head{
    align-items:center;
  }

  /* CHANGED: arrows stay together, Today goes underneath */
  .cal-nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:6px;
    width:75px;
  }

  .cal-nav button{
    background:none;
    border:1.5px solid var(--indigo);
    color:var(--indigo);
    width:28px;
    height:28px;
    font-size:1rem;
    font-weight:700;
  }

  .cal-nav button:hover{
    background:var(--indigo);
    color:var(--cream);
  }

  /* CHANGED: smaller Today button underneath */
  .cal-today-btn{
    flex-basis:100%;
    width:max-content !important;
    height:auto !important;
    background:none;
    border:1px solid var(--periwinkle);
    color:var(--indigo);
    padding:2px 6px;
    font-size:0.65rem;
    font-weight:600;
    margin:0 auto;
  }

  .cal-today-btn:hover{
    background:var(--periwinkle);
    color:var(--cream);
  }

  .cal-body{
    display:flex;
    gap:18px;
    flex:1;
    min-height:0;
  }

  .cal-grid-wrap{
    flex:1.3;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:4px;
  }

  .cal-weekdays span{
    text-align:center;
    font-size:0.72rem;
    font-weight:700;
    color:var(--periwinkle);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }

  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:1fr;
    flex:1;
    gap:3px;
  }

  .cal-cell{
    background:var(--cream);
    border:1px solid var(--lavender);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:5px 2px 0;
    cursor:pointer;
    font-size:0.85rem;
    position:relative;
    min-height:0;
  }

  .cal-cell:hover{
    border-color:var(--periwinkle);
  }

  .cal-cell.other-month{
    color:var(--periwinkle);
    opacity:0.45;
  }

  .cal-cell.today{
    background:var(--peach);
    font-weight:700;
  }

  .cal-cell.selected{
    border:1.5px solid var(--indigo);
  }

  .cal-dot{
    width:5px;
    height:5px;
    background:var(--rose);
    margin-top:3px;
    border-radius:0;
    transform:rotate(45deg);
  }

  .cal-day-panel{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    border-left:1.5px dashed var(--lavender);
    padding-left:18px;
  }

  .cal-day-panel h3{
    font-size:1rem;
    color:var(--indigo);
    margin-bottom:2px;
  }

  .cal-day-sub{
    font-size:0.78rem;
    color:var(--periwinkle);
    margin-bottom:12px;
  }

  .event-list{
    overflow-y:auto;
    flex:1;
    margin-bottom:10px;
  }

  .event-item{
    background:var(--cream);
    border-left:3px solid var(--rose);
    padding:7px 9px;
    margin-bottom:7px;
    font-size:0.85rem;
    position:relative;
  }

  .event-item .ev-time{
    font-weight:700;
    color:var(--indigo);
    font-size:0.75rem;
    display:block;
  }

  .event-item button{
    position:absolute;
    top:4px;
    right:6px;
    background:none;
    border:none;
    color:var(--periwinkle);
    font-size:0.95rem;
  }

  .event-item button:hover{
    color:var(--rose);
  }

  .event-empty{
    color:var(--periwinkle);
    font-size:0.83rem;
    font-style:italic;
  }

  .event-add{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .event-add input{
    padding:8px 9px;
    border:1.5px solid var(--lavender);
    background:var(--panel);
    font-size:0.83rem;
    color:var(--ink);
  }

  .event-add input:focus{
    outline:none;
    border-color:var(--periwinkle);
  }

  .event-add button{
    padding:8px;
    background:var(--indigo);
    color:var(--cream);
    border:1.5px solid var(--indigo);
    font-weight:600;
    font-size:0.82rem;
  }

  .event-add button:hover{
    background:var(--ink);
  }

  /* ================= POMODORO ================= */

  .pomo-panel{
    align-items:stretch;
  }

  .pomo-body{
    display:flex;
    gap:18px;
    flex:1;
    min-height:0;
  }

  .pomo-left{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .pomo-modes{
    display:flex;
    gap:6px;
    margin-bottom:14px;
  }

  .pomo-modes button{
    padding:6px 10px;
    background:none;
    border:1.5px solid var(--periwinkle);
    color:var(--indigo);
    font-size:0.78rem;
    font-weight:600;
  }

  .pomo-modes button.active{
    background:var(--indigo);
    color:var(--cream);
    border-color:var(--indigo);
  }

  .pomo-modes button:hover:not(.active){
    border-color:var(--indigo);
  }

  .pomo-clock{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:3rem;
    color:var(--indigo);
    line-height:1;
    margin-bottom:4px;
    letter-spacing:0.02em;
  }

  .pomo-phase{
    font-size:0.78rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--periwinkle);
    margin-bottom:14px;
  }

  .pomo-controls{
    display:flex;
    gap:8px;
  }

  .pomo-controls button{
    padding:9px 16px;
    font-size:0.82rem;
    font-weight:700;
    letter-spacing:0.02em;
    border:1.5px solid var(--indigo);
  }

  #startBtn{
    background:var(--indigo);
    color:var(--cream);
  }

  #startBtn:hover{
    background:var(--ink);
  }

  #resetBtn{
    background:none;
    color:var(--indigo);
  }

  #resetBtn:hover{
    background:var(--lavender);
  }

  .pomo-right{
    flex:1;
    border-left:1.5px dashed var(--lavender);
    padding-left:18px;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .pomo-right h3{
    font-size:0.85rem;
    color:var(--indigo);
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .noise-grid{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:14px;
  }

  .noise-btn{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    background:var(--cream);
    border:1.5px solid var(--lavender);
    color:var(--ink);
    font-size:0.82rem;
    text-align:left;
  }

  .noise-btn:hover{
    border-color:var(--periwinkle);
  }

  .noise-btn.active{
    border-color:var(--indigo);
    background:var(--peach);
    font-weight:600;
  }

  .noise-dot{
    width:8px;
    height:8px;
    background:var(--periwinkle);
    flex:none;
    transform:rotate(45deg);
  }

  .noise-btn.active .noise-dot{
    background:var(--rose);
  }

  .vol-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:auto;
    font-size:0.78rem;
    color:var(--periwinkle);
  }

  .vol-row input[type=range]{
    flex:1;
    accent-color:var(--indigo);
  }

  ::-webkit-scrollbar{
    width:6px;
  }

  ::-webkit-scrollbar-thumb{
    background:var(--periwinkle);
  }

  ::-webkit-scrollbar-track{
    background:transparent;
  }

  @media (max-width: 880px){
    .app{
      grid-template-columns:1fr;
      grid-auto-rows:auto;
      height:auto;
    }

    .col-right{
      grid-template-rows:auto auto;
    }

    .cal-body,
    .pomo-body{
      flex-direction:column;
    }

    .cal-day-panel,
    .pomo-right{
      border-left:none;
      padding-left:0;
      border-top:1.5px dashed var(--lavender);
      padding-top:14px;
      margin-top:14px;
    }
  }
</style>
</head>

<body>

<div class="app">

  <!-- ===== TO-DO ===== -->
  <section class="panel todo-panel">

    <span class="cm-tr"></span>
    <span class="cm-br"></span>

    <div class="panel-head">
      <h2>To-Do List</h2>
      <span class="tag" id="todoCount">0 tasks</span>
    </div>

    <div class="todo-add">
      <input
        type="text"
        id="todoInput"
        placeholder="Add a task…"
        maxlength="140"
      >
      <button id="todoAddBtn">Add</button>
    </div>

    <div class="todo-list" id="todoList"></div>

  </section>


  <div class="col-right">

    <!-- ===== CALENDAR ===== -->
    <section class="panel cal-panel">

      <span class="cm-tr"></span>
      <span class="cm-br"></span>

      <div class="panel-head">

        <h2 id="calTitle">Month Year</h2>

        <div class="cal-nav">
          <button id="calPrev">‹</button>
          <button id="calNext">›</button>
          <button class="cal-today-btn" id="calTodayBtn">
            Today
          </button>
        </div>

      </div>

      <div class="cal-body">

        <div class="cal-grid-wrap">

          <div class="cal-weekdays">
            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
          </div>

          <div class="cal-grid" id="calGrid"></div>

        </div>

        <div class="cal-day-panel">

          <h3 id="dayTitle">Today</h3>
          <div class="cal-day-sub" id="daySub">—</div>

          <div class="event-list" id="eventList"></div>

          <div class="event-add">

            <input
              type="text"
              id="evTitle"
              placeholder="Event or deadline title"
              maxlength="80"
            >

            <input
              type="time"
              id="evTime"
            >

            <input
              type="text"
              id="evNote"
              placeholder="Reminder note (optional)"
              maxlength="120"
            >

            <button id="evAddBtn">
              Add to this day
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- ===== POMODORO ===== -->
    <section class="panel pomo-panel">

      <span class="cm-tr"></span>
      <span class="cm-br"></span>

      <div class="panel-head">
        <h2>Pomodoro Timer</h2>
        <span class="tag">focus &amp; breathe</span>
      </div>

      <div class="pomo-body">

        <div class="pomo-left">

          <div class="pomo-modes" id="pomoModes">

            <button
              data-work="25"
              data-break="5"
              class="active"
            >
              25 / 5
            </button>

            <button
              data-work="50"
              data-break="10"
            >
              50 / 10
            </button>

            <button
              data-work="45"
              data-break="15"
            >
              45 / 15
            </button>

          </div>

          <div class="pomo-clock" id="pomoClock">
            25:00
          </div>

          <div class="pomo-phase" id="pomoPhase">
            Focus session
          </div>

          <div class="pomo-controls">

            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>

          </div>

        </div>


        <div class="pomo-right">

          <h3>Background noise</h3>

          <div class="noise-grid" id="noiseGrid">

            <button class="noise-btn" data-type="classic">
              <span class="noise-dot"></span>
              Classic Brown
            </button>

            <button class="noise-btn" data-type="deep">
              <span class="noise-dot"></span>
              Deep Brown
            </button>

            <button class="noise-btn" data-type="soft">
              <span class="noise-dot"></span>
              Soft Brown
            </button>

            <button class="noise-btn" data-type="ocean">
              <span class="noise-dot"></span>
              Ocean Brown
            </button>

            <button class="noise-btn" data-type="warm">
              <span class="noise-dot"></span>
              Warm Brown
            </button>

          </div>

          <div class="vol-row">
            <span>Vol</span>
            <input
              type="range"
              id="volSlider"
              min="0"
              max="100"
              value="35"
            >
          </div>

        </div>

      </div>

    </section>

  </div>

</div>


<script>

/* =========================================================
   TO-DO LIST
========================================================= */

let todos = [];
let todoIdSeq = 1;

const todoList = document.getElementById('todoList');
const todoInput = document.getElementById('todoInput');
const todoCount = document.getElementById('todoCount');

function renderTodos(){

  todoList.innerHTML = '';

  if(todos.length === 0){
    todoList.innerHTML =
      '<div class="todo-empty">Nothing on the list yet — add your first task above.</div>';
  }

  todos.forEach(t=>{

    const row = document.createElement('div');

    row.className =
      'todo-item' + (t.done ? ' done' : '');

    row.innerHTML = `
      <input type="checkbox" ${t.done ? 'checked' : ''}>
      <span></span>
      <button title="Delete">×</button>
    `;

    row.querySelector('span').textContent = t.text;

    row.querySelector('input').addEventListener(
      'change',
      ()=>{
        t.done = !t.done;
        renderTodos();
      }
    );

    row.querySelector('button').addEventListener(
      'click',
      ()=>{
        todos = todos.filter(x=>x.id!==t.id);
        renderTodos();
      }
    );

    todoList.appendChild(row);

  });

  const open =
    todos.filter(t=>!t.done).length;

  todoCount.textContent =
    `${open} task${open===1?'':'s'}`;

}

function addTodo(){

  const val =
    todoInput.value.trim();

  if(!val) return;

  todos.push({
    id:todoIdSeq++,
    text:val,
    done:false
  });

  todoInput.value = '';

  renderTodos();
}

document
  .getElementById('todoAddBtn')
  .addEventListener('click', addTodo);

todoInput.addEventListener(
  'keydown',
  e=>{
    if(e.key==='Enter') addTodo();
  }
);

renderTodos();


/* =========================================================
   CALENDAR
========================================================= */

const today = new Date();

today.setHours(0,0,0,0);

let viewYear =
  today.getFullYear();

let viewMonth =
  today.getMonth();

let selectedDate =
  new Date(today);

const events = {};

let eventIdSeq = 1;

const monthNames = [
  'January',
  'February',
  'March',
  'April',
  'May',
  'June',
  'July',
  'August',
  'September',
  'October',
  'November',
  'December'
];

function dateKey(d){

  return `${d.getFullYear()}-${String(
    d.getMonth()+1
  ).padStart(2,'0')}-${String(
    d.getDate()
  ).padStart(2,'0')}`;

}

function isSameDay(a,b){

  return (
    a.getFullYear()===b.getFullYear() &&
    a.getMonth()===b.getMonth() &&
    a.getDate()===b.getDate()
  );

}

const calTitle =
  document.getElementById('calTitle');

const calGrid =
  document.getElementById('calGrid');

function renderCalendar(){

  calTitle.textContent =
    `${monthNames[viewMonth]} ${viewYear}`;

  calGrid.innerHTML = '';

  const firstOfMonth =
    new Date(viewYear, viewMonth, 1);

  const startOffset =
    firstOfMonth.getDay();

  const gridStart =
    new Date(
      viewYear,
      viewMonth,
      1 - startOffset
    );

  for(let i=0;i<42;i++){

    const cellDate =
      new Date(gridStart);

    cellDate.setDate(
      gridStart.getDate()+i
    );

    const cell =
      document.createElement('div');

    cell.className =
      'cal-cell';

    if(
      cellDate.getMonth() !== viewMonth
    ){
      cell.classList.add('other-month');
    }

    if(
      isSameDay(cellDate,today)
    ){
      cell.classList.add('today');
    }

    if(
      isSameDay(cellDate,selectedDate)
    ){
      cell.classList.add('selected');
    }

    const num =
      document.createElement('div');

    num.textContent =
      cellDate.getDate();

    cell.appendChild(num);

    if(
      (events[dateKey(cellDate)]||[]).length
    ){

      const dot =
        document.createElement('div');

      dot.className =
        'cal-dot';

      cell.appendChild(dot);

    }

    cell.addEventListener(
      'click',
      ()=>{

        selectedDate =
          cellDate;

        if(
          cellDate.getMonth() !== viewMonth ||
          cellDate.getFullYear() !== viewYear
        ){

          viewMonth =
            cellDate.getMonth();

          viewYear =
            cellDate.getFullYear();

        }

        renderCalendar();
        renderDayPanel();

      }
    );

    calGrid.appendChild(cell);

  }

}


const dayTitle =
  document.getElementById('dayTitle');

const daySub =
  document.getElementById('daySub');

const eventList =
  document.getElementById('eventList');

function renderDayPanel(){

  const key =
    dateKey(selectedDate);

  const isToday =
    isSameDay(selectedDate,today);

  dayTitle.textContent =
    isToday
      ? 'Today'
      : selectedDate.toLocaleDateString(
          undefined,
          {weekday:'long'}
        );

  daySub.textContent =
    selectedDate.toLocaleDateString(
      undefined,
      {
        month:'long',
        day:'numeric',
        year:'numeric'
      }
    );

  const list =
    events[key] || [];

  eventList.innerHTML = '';

  if(list.length === 0){

    eventList.innerHTML =
      '<div class="event-empty">No events or reminders for this day.</div>';

  }

  list.sort(
    (a,b)=>
      (a.time||'99:99')
        .localeCompare(b.time||'99:99')
  );

  list.forEach(ev=>{

    const item =
      document.createElement('div');

    item.className =
      'event-item';

    item.innerHTML =
      `${ev.time ? `<span class="ev-time">${formatTime(ev.time)}</span>` : ''}<div></div><button title="Remove">×</button>`;

    item.querySelector('div').textContent =
      ev.title +
      (ev.note ? ` — ${ev.note}` : '');

    item.querySelector('button')
      .addEventListener(
        'click',
        ()=>{

          events[key] =
            events[key].filter(
              x=>x.id!==ev.id
            );

          renderDayPanel();
          renderCalendar();

        }
      );

    eventList.appendChild(item);

  });

}

function formatTime(t){

  const [h,m] =
    t.split(':').map(Number);

  const ampm =
    h>=12 ? 'PM' : 'AM';

  const h12 =
    ((h+11)%12)+1;

  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;

}


document
  .getElementById('calPrev')
  .addEventListener(
    'click',
    ()=>{

      viewMonth--;

      if(viewMonth<0){
        viewMonth=11;
        viewYear--;
      }

      renderCalendar();

    }
  );


document
  .getElementById('calNext')
  .addEventListener(
    'click',
    ()=>{

      viewMonth++;

      if(viewMonth>11){
        viewMonth=0;
        viewYear++;
      }

      renderCalendar();

    }
  );


document
  .getElementById('calTodayBtn')
  .addEventListener(
    'click',
    ()=>{

      viewMonth =
        today.getMonth();

      viewYear =
        today.getFullYear();

      selectedDate =
        new Date(today);

      renderCalendar();
      renderDayPanel();

    }
  );


document
  .getElementById('evAddBtn')
  .addEventListener(
    'click',
    ()=>{

      const title =
        document
          .getElementById('evTitle')
          .value
          .trim();

      if(!title) return;

      const time =
        document
          .getElementById('evTime')
          .value;

      const note =
        document
          .getElementById('evNote')
          .value
          .trim();

      const key =
        dateKey(selectedDate);

      if(!events[key])
        events[key] = [];

      events[key].push({
        id:eventIdSeq++,
        title,
        time,
        note
      });

      document.getElementById('evTitle').value='';
      document.getElementById('evTime').value='';
      document.getElementById('evNote').value='';

      renderDayPanel();
      renderCalendar();

    }
  );


renderCalendar();
renderDayPanel();


/* =========================================================
   POMODORO TIMER
========================================================= */

let workMinutes = 25;
let breakMinutes = 5;

let phase = 'focus';

let remaining =
  workMinutes*60;

let running = false;
let tickHandle = null;

const pomoClock =
  document.getElementById('pomoClock');

const pomoPhase =
  document.getElementById('pomoPhase');

const startBtn =
  document.getElementById('startBtn');

function fmt(s){

  const m =
    Math.floor(s/60);

  const sec =
    s%60;

  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

}

function renderClock(){

  pomoClock.textContent =
    fmt(remaining);

  pomoPhase.textContent =
    phase === 'focus'
      ? 'Focus session'
      : 'Break';

}

renderClock();


document
  .getElementById('pomoModes')
  .addEventListener(
    'click',
    e=>{

      const btn =
        e.target.closest('button');

      if(!btn) return;

      document
        .querySelectorAll('#pomoModes button')
        .forEach(
          b=>b.classList.remove('active')
        );

      btn.classList.add('active');

      workMinutes =
        Number(btn.dataset.work);

      breakMinutes =
        Number(btn.dataset.break);

      stopTimer();

      phase='focus';

      remaining =
        workMinutes*60;

      renderClock();

    }
  );


function startTimer(){

  running = true;

  startBtn.textContent =
    'Pause';

  playBeep(1);

  startNoise();

  tickHandle =
    setInterval(
      ()=>{

        remaining--;

        if(remaining <= 0){

          playBeep(3);

          phase =
            phase === 'focus'
              ? 'break'
              : 'focus';

          remaining =
            (
              phase === 'focus'
                ? workMinutes
                : breakMinutes
            ) * 60;

        }

        renderClock();

      },
      1000
    );

}


function pauseTimer(){

  running = false;

  startBtn.textContent =
    'Start';

  clearInterval(tickHandle);

  stopNoise();

}


function stopTimer(){
  pauseTimer();
}


function resetTimer(){

  stopTimer();

  phase =
    'focus';

  remaining =
    workMinutes*60;

  renderClock();

}


startBtn.addEventListener(
  'click',
  ()=>{
    running
      ? pauseTimer()
      : startTimer();
  }
);


document
  .getElementById('resetBtn')
  .addEventListener(
    'click',
    resetTimer
  );


/* =========================================================
   AUDIO: beeps + 5 brown-noise textures
========================================================= */

let audioCtx = null;

function getCtx(){

  if(!audioCtx)
    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  return audioCtx;

}


function playBeep(times){

  const ctx =
    getCtx();

  let t =
    ctx.currentTime;

  for(let i=0;i<times;i++){

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.type =
      'sine';

    osc.frequency.value =
      880;

    gain.gain.setValueAtTime(
      0.0001,
      t
    );

    gain.gain.linearRampToValueAtTime(
      0.18,
      t+0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      t+0.22
    );

    osc.connect(gain)
      .connect(ctx.destination);

    osc.start(t);

    osc.stop(t+0.25);

    t += 0.32;

  }

}


let noiseType = null;

let noiseSource = null;
let noiseFilter = null;
let noiseGain = null;
let noiseLFO = null;


function makeBrownBuffer(ctx,seconds){

  const len =
    ctx.sampleRate * seconds;

  const buffer =
    ctx.createBuffer(
      1,
      len,
      ctx.sampleRate
    );

  const data =
    buffer.getChannelData(0);

  let last = 0;

  for(let i=0;i<len;i++){

    const white =
      Math.random()*2-1;

    let v =
      (last + 0.02*white) / 1.02;

    last = v;

    data[i] =
      v * 3.2;

  }

  return buffer;

}


const noiseProfiles = {

  classic:{
    freq:1200,
    q:0.5,
    lfo:0
  },

  deep:{
    freq:450,
    q:0.6,
    lfo:0
  },

  soft:{
    freq:900,
    q:0.3,
    lfo:0
  },

  ocean:{
    freq:1000,
    q:0.5,
    lfo:0.08
  },

  warm:{
    freq:700,
    q:1.1,
    lfo:0
  }

};


function startNoise(){

  if(!noiseType) return;

  stopNoiseNodesOnly();

  const ctx =
    getCtx();

  const profile =
    noiseProfiles[noiseType];

  noiseSource =
    ctx.createBufferSource();

  noiseSource.buffer =
    makeBrownBuffer(ctx,4);

  noiseSource.loop =
    true;

  noiseFilter =
    ctx.createBiquadFilter();

  noiseFilter.type =
    'lowpass';

  noiseFilter.frequency.value =
    profile.freq;

  noiseFilter.Q.value =
    profile.q;

  noiseGain =
    ctx.createGain();

  noiseGain.gain.value =
    document.getElementById(
      'volSlider'
    ).value / 300;

  noiseSource
    .connect(noiseFilter)
    .connect(noiseGain)
    .connect(ctx.destination);

  noiseSource.start();

  if(profile.lfo > 0){

    noiseLFO =
      ctx.createOscillator();

    const lfoGain =
      ctx.createGain();

    noiseLFO.frequency.value =
      profile.lfo;

    lfoGain.gain.value =
      noiseGain.gain.value * 0.35;

    noiseLFO
      .connect(lfoGain)
      .connect(noiseGain.gain);

    noiseLFO.start();

  }

}


function stopNoiseNodesOnly(){

  if(noiseSource){

    try{
      noiseSource.stop();
    }catch(e){}

    noiseSource.disconnect();

    noiseSource = null;

  }

  if(noiseLFO){

    try{
      noiseLFO.stop();
    }catch(e){}

    noiseLFO.disconnect();

    noiseLFO = null;

  }

  if(noiseFilter){

    noiseFilter.disconnect();

    noiseFilter = null;

  }

  if(noiseGain){

    noiseGain.disconnect();

    noiseGain = null;

  }

}


function stopNoise(){
  stopNoiseNodesOnly();
}


document
  .getElementById('noiseGrid')
  .addEventListener(
    'click',
    e=>{

      const btn =
        e.target.closest('.noise-btn');

      if(!btn) return;

      const type =
        btn.dataset.type;

      document
        .querySelectorAll('.noise-btn')
        .forEach(
          b=>b.classList.remove('active')
        );

      if(noiseType === type){

        noiseType = null;

        stopNoise();

      }else{

        noiseType = type;

        btn.classList.add('active');

        if(running)
          startNoise();

      }

    }
  );


document
  .getElementById('volSlider')
  .addEventListener(
    'input',
    e=>{

      if(noiseGain)
        noiseGain.gain.value =
          e.target.value / 300;

    }
  );

</script>
