<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Period Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #db8896;
    margin: 0;
    padding: 24px;
    color: #8a1030;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 20px; color:#3b010b; }
  .label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #3b010b; }
  .card {
    background: #faf4d4;
    border: 1px solid #faf4d4;
    border-radius: 0;
    padding: 14px;
    margin-bottom: 20px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 6px 4px; font-weight: 600; color: #3b010b; }
  td { padding: 6px 4px; }
  input[type="date"], input[type="text"], textarea {
    width: 100%;
    background: #faf4d4;
    border: 1px solid #faf4d4;
    border-radius: 0;
    padding: 6px 8px;
    font-size: 12px;
    color: #3b010b;
    font-family: inherit;
  }
  .hint { font-size: 11px; color: #733438; margin-top: 8px; }
  .day-count { font-size: 24px; font-weight: 700; color: #3b010b; }
  .day-sub { font-size: 12px; color: #733438; margin-left: 6px; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  button {
    font-family: inherit;
    font-size: 13px;
    border-radius: 0;
    padding: 8px;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    flex: 1;
    background: #3b010b;
    color: #faf4d4;
    font-weight: 600;
    border: 1px solid #660005;
  }
  .btn-secondary {
    flex: 1;
    background: transparent;
    border: 1px solid #faf4d4;
    color: #3b010b;
  }
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .nav-arrow {
    background: none;
    border: none;
    font-size: 18px;
    color: #3b010b;
    cursor: pointer;
    padding: 4px 8px;
  }
  .nav-date { font-size: 12px; font-weight: 600; color: #3b010b; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pill {
    background: transparent;
    border: 1px solid #faf4d4;
    color: #3b010b;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 0;
    cursor: pointer;
  }
  .pill.selected {
    background: #660005;
    border-color: #9c4651;
    color: #faf4d4;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 .card { margin-bottom: 0; }
  .affirmation-text { font-size: 12px; color: #3b010b; line-height: 1.5; min-height: 48px; }
  .cravings-input { min-height: 44px; resize: vertical; }

  /* collapsible yearly tracker */
  .collapse-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .collapse-toggle .chevron {
    font-size: 14px;
    transition: transform 0.15s ease;
  }
  .collapse-toggle.open .chevron { transform: rotate(90deg); }
  .collapse-body { display: none; margin-top: 10px; }
  .collapse-body.open { display: block; }
  .divider { border: none; border-top: 1px solid #faf4d4; margin: 16px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Period tracker</h1>

  <!-- Section 1: Yearly tracker (collapsible) + cycle day counter -->
  <div class="card">
    <div class="collapse-toggle" id="yearly-toggle">
      <span class="label" style="margin-bottom:0;">Yearly tracker</span>
      <span class="chevron">&#9656;</span>
    </div>
    <div class="collapse-body" id="yearly-body">
      <table>
        <thead>
          <tr><th>Month</th><th>Start date</th><th>End date</th></tr>
        </thead>
        <tbody id="yearly-table"></tbody>
      </table>
      <div class="hint">She fills in her own start/end date for each month.</div>
    </div>

    <hr class="divider">

    <div class="label">Cycle day counter</div>
    <span class="day-count" id="cycle-day">Day 0</span>
    <span class="day-sub">of this cycle</span>
    <div class="btn-row">
      <button class="btn-primary" id="tap-today">Tap today</button>
      <button class="btn-secondary" id="reset-cycle">Reset</button>
    </div>
    <div class="hint">Each tap adds a day into this month's row above.</div>
  </div>

  <!-- Section 2: Symptoms -->
  <div class="label">Symptoms</div>
  <div class="card">
    <div class="nav-row">
      <button class="nav-arrow" id="prev-day" aria-label="Previous day">&#8592;</button>
      <span class="nav-date" id="symptom-date"></span>
      <button class="nav-arrow" id="next-day" aria-label="Next day">&#8594;</button>
    </div>
    <div class="pills" id="symptom-pills">
      <button class="pill" data-symptom="Cramps">Cramps</button>
      <button class="pill" data-symptom="Headache">Headache</button>
      <button class="pill" data-symptom="Bloating">Bloating</button>
      <button class="pill" data-symptom="Back pain">Back pain</button>
      <button class="pill" data-symptom="Acne">Acne</button>
      <button class="pill" data-symptom="Other">Something else</button>
    </div>
    <textarea id="symptom-note" placeholder="Write more about it..." rows="2"></textarea>
  </div>

  <!-- Section 3: Cravings log + affirmation -->
  <div class="grid2">
    <div class="card">
      <div class="label">Cravings log</div>
      <div class="hint" style="margin:0 0 6px;">What did you crave today?</div>
      <textarea class="cravings-input" id="cravings-note" placeholder="Type here..."></textarea>
    </div>
    <div class="card">
      <div class="label">Affirmation</div>
      <div class="affirmation-text" id="affirmation-text"></div>
    </div>
  </div>

</div>

<script>
  // ---------- Collapsible yearly tracker ----------
  const yearlyToggle = document.getElementById("yearly-toggle");
  const yearlyBody = document.getElementById("yearly-body");
  yearlyToggle.addEventListener("click", () => {
    yearlyToggle.classList.toggle("open");
    yearlyBody.classList.toggle("open");
  });

  // ---------- Yearly tracker rows ----------
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const yearlyTable = document.getElementById("yearly-table");
  months.forEach(month => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${month}</td>
      <td><input type="date" data-month="${month}" data-field="start"></td>
      <td><input type="date" data-month="${month}" data-field="end"></td>
    `;
    yearlyTable.appendChild(row);
  });

  // ---------- Cycle day counter ----------
  let cycleDay = 0;
  const cycleDayEl = document.getElementById("cycle-day");
  document.getElementById("tap-today").addEventListener("click", () => {
    cycleDay++;
    cycleDayEl.textContent = `Day ${cycleDay}`;
  });
  document.getElementById("reset-cycle").addEventListener("click", () => {
    cycleDay = 0;
    cycleDayEl.textContent = `Day ${cycleDay}`;
  });

  // ---------- Symptoms with day navigation ----------
  let currentDate = new Date();
  const symptomLog = {}; // { "YYYY-MM-DD": { symptoms: [...], note: "" } }

  function dateKey(d) {
    return d.toISOString().split("T")[0];
  }
  function formatDate(d) {
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  const symptomDateEl = document.getElementById("symptom-date");
  const symptomNoteEl = document.getElementById("symptom-note");
  const pills = document.querySelectorAll(".pill");

  function renderSymptomDay() {
    const key = dateKey(currentDate);
    symptomDateEl.textContent = formatDate(currentDate);
    const entry = symptomLog[key] || { symptoms: [], note: "" };
    pills.forEach(pill => {
      pill.classList.toggle("selected", entry.symptoms.includes(pill.dataset.symptom));
    });
    symptomNoteEl.value = entry.note;
  }

  function saveNote() {
    const key = dateKey(currentDate);
    if (!symptomLog[key]) symptomLog[key] = { symptoms: [], note: "" };
    symptomLog[key].note = symptomNoteEl.value;
  }

  pills.forEach(pill => {
    pill.addEventListener("click", () => {
      const key = dateKey(currentDate);
      if (!symptomLog[key]) symptomLog[key] = { symptoms: [], note: "" };
      const list = symptomLog[key].symptoms;
      const s = pill.dataset.symptom;
      if (list.includes(s)) {
        symptomLog[key].symptoms = list.filter(x => x !== s);
      } else {
        list.push(s);
      }
      renderSymptomDay();
    });
  });

  symptomNoteEl.addEventListener("input", saveNote);

  document.getElementById("prev-day").addEventListener("click", () => {
    saveNote();
    currentDate.setDate(currentDate.getDate() - 1);
    renderSymptomDay();
  });
  document.getElementById("next-day").addEventListener("click", () => {
    saveNote();
    currentDate.setDate(currentDate.getDate() + 1);
    renderSymptomDay();
  });

  renderSymptomDay();

  // ---------- Affirmations, rotating every minute ----------
  const affirmations = [
    "Your body is doing exactly what it needs to.",
    "Rest is productive too.",
    "This phase will pass, be gentle with yourself.",
    "You are allowed to slow down today.",
    "Your feelings this week are valid.",
    "Small comforts count as self care.",
    "You don't have to push through everything.",
    "Your body deserves patience, not judgment."
  ];
  const affirmationEl = document.getElementById("affirmation-text");
  function showRandomAffirmation() {
    const i = Math.floor(Math.random() * affirmations.length);
    affirmationEl.textContent = affirmations[i];
  }
  showRandomAffirmation();
  setInterval(showRandomAffirmation, 60000);
</script>
</body>
</html>
